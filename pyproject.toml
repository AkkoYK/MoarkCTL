[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moarkctl"
version = "0.2.0"
description = "Let local agents manage Moark compute-container lifecycle."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Akko" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
moarkctl = "moarkctl.cli:main"
mc = "moarkctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
