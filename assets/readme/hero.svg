<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">MoarkCTL</title>
  <desc id="desc">The mc command discovers all Moark compute containers, applies an explicit target gate, and controls their lifecycle without SSH or deletion.</desc>

  <rect width="1200" height="400" rx="28" fill="#070a0f"/>
  <path d="M0 348H1200" stroke="#223044"/>
  <path d="M676 36V348" stroke="#223044"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="67" fill="#7fa8d1" font-size="18" font-weight="700" letter-spacing="2">MOARK COMPUTE / LIFECYCLE CONTROL</text>
    <text x="60" y="151" fill="#f4f7fa" font-size="76" font-weight="750" letter-spacing="-3">Moark<tspan fill="#7fa8d1">CTL</tspan></text>
    <text x="64" y="204" fill="#b7c1cd" font-size="27" font-weight="500">Token-wide discovery and explicit control</text>
    <text x="64" y="240" fill="#b7c1cd" font-size="27" font-weight="500">for every compute container.</text>

    <rect x="64" y="277" width="548" height="62" rx="12" fill="#0d131d" stroke="#26384d"/>
    <text x="86" y="315" fill="#7fa8d1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">&gt;_</text>
    <text x="126" y="315" fill="#e7edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">mc on ascend-lab -w</text>

    <g transform="translate(716 48)">
      <text x="0" y="20" fill="#8995a4" font-size="18" font-weight="700" letter-spacing="1.4">CONTROL PATH</text>

      <g transform="translate(0 42)">
        <rect width="126" height="70" rx="13" fill="#0d131d" stroke="#26384d"/>
        <text x="18" y="29" fill="#7fa8d1" font-size="18" font-weight="750">01 · LIST</text>
        <text x="18" y="53" fill="#b7c1cd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">mc ls</text>
      </g>
      <path d="M126 77H152" stroke="#5f86b3" stroke-width="2"/>
      <path d="M145 71L152 77L145 83" fill="none" stroke="#5f86b3" stroke-width="2"/>

      <g transform="translate(154 42)">
        <rect width="126" height="70" rx="13" fill="#0d131d" stroke="#26384d"/>
        <text x="18" y="29" fill="#7fa8d1" font-size="18" font-weight="750">02 · TARGET</text>
        <text x="18" y="53" fill="#b7c1cd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">name / id</text>
      </g>
      <path d="M280 77H306" stroke="#5f86b3" stroke-width="2"/>
      <path d="M299 71L306 77L299 83" fill="none" stroke="#5f86b3" stroke-width="2"/>

      <g transform="translate(308 42)">
        <rect width="126" height="70" rx="13" fill="#0d131d" stroke="#26384d"/>
        <text x="18" y="29" fill="#7fa8d1" font-size="18" font-weight="750">03 · WAIT</text>
        <text x="18" y="53" fill="#b7c1cd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">all targets</text>
      </g>
    </g>

    <g transform="translate(716 190)">
      <rect width="434" height="58" rx="12" fill="#0b1018" stroke="#26384d"/>
      <circle cx="26" cy="29" r="7" fill="#66707d"/>
      <text x="48" y="36" fill="#f4f7fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">ascend-lab</text>
      <text x="288" y="36" fill="#8995a4" font-size="18" font-weight="700">STOPPED</text>
      <path d="M377 29H405" stroke="#4f78a6" stroke-width="2"/>
    </g>

    <g transform="translate(716 264)">
      <rect width="434" height="58" rx="12" fill="#0b1018" stroke="#26384d"/>
      <circle cx="26" cy="29" r="7" fill="#9ab7d4"/>
      <text x="48" y="36" fill="#f4f7fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">training</text>
      <text x="288" y="36" fill="#9ab7d4" font-size="18" font-weight="700">RUNNING</text>
      <path d="M377 29H405" stroke="#7fa8d1" stroke-width="2"/>
    </g>

    <text x="64" y="378" fill="#778393" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">NO SSH</text>
    <text x="184" y="378" fill="#778393" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">NO DELETE</text>
    <text x="335" y="378" fill="#778393" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">MULTI-TARGET WAIT</text>
    <text x="1030" y="378" fill="#7fa8d1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">mc / 0.3.0</text>
  </g>
</svg>
