<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">MoarkCTL for Moark compute-container lifecycle control</title>
  <desc id="desc">The mc command discovers every token-owned compute container, resolves explicit targets, and waits for every selected lifecycle operation.</desc>

  <rect width="1200" height="420" rx="28" fill="#070a0f"/>
  <path d="M0 360H1200" stroke="#223044"/>
  <path d="M680 36V360" stroke="#223044"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="68" fill="#7fa8d1" font-size="18" font-weight="700" letter-spacing="1.4">MOARK COMPUTE / LIFECYCLE CONTROL</text>
    <text x="60" y="156" fill="#f4f7fa" font-size="76" font-weight="700" letter-spacing="-3">Moark<tspan fill="#7fa8d1">CTL</tspan></text>
    <text x="64" y="210" fill="#b7c1cd" font-size="25" font-weight="500">Discover every token-owned container</text>
    <text x="64" y="244" fill="#b7c1cd" font-size="25" font-weight="500">and confirm every selected transition.</text>

    <rect x="64" y="286" width="548" height="60" rx="12" fill="#0d131d" stroke="#26384d"/>
    <text x="86" y="323" fill="#7fa8d1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">&gt;_</text>
    <text x="126" y="323" fill="#e7edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">mc on ascend-lab -w</text>

    <g transform="translate(716 42)">
      <text x="0" y="26" fill="#8995a4" font-size="18" font-weight="700" letter-spacing="1.2">CONTROL PATH</text>

      <g transform="translate(0 48)">
        <rect width="132" height="72" rx="13" fill="#0d131d" stroke="#26384d"/>
        <text x="16" y="30" fill="#7fa8d1" font-size="18" font-weight="700">01 LIST</text>
        <text x="16" y="56" fill="#b7c1cd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">mc ls</text>
      </g>
      <path d="M132 84H151" stroke="#5f86b3" stroke-width="2"/>
      <path d="M144 78L151 84L144 90" fill="none" stroke="#5f86b3" stroke-width="2"/>

      <g transform="translate(151 48)">
        <rect width="132" height="72" rx="13" fill="#0d131d" stroke="#26384d"/>
        <text x="16" y="30" fill="#7fa8d1" font-size="18" font-weight="700">02 TARGET</text>
        <text x="16" y="56" fill="#b7c1cd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">name / id</text>
      </g>
      <path d="M283 84H302" stroke="#5f86b3" stroke-width="2"/>
      <path d="M295 78L302 84L295 90" fill="none" stroke="#5f86b3" stroke-width="2"/>

      <g transform="translate(302 48)">
        <rect width="132" height="72" rx="13" fill="#0d131d" stroke="#26384d"/>
        <text x="16" y="30" fill="#7fa8d1" font-size="18" font-weight="700">03 WAIT</text>
        <text x="16" y="56" fill="#b7c1cd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">wait all</text>
      </g>
    </g>

    <g transform="translate(716 208)">
      <rect width="434" height="58" rx="12" fill="#0b1018" stroke="#26384d"/>
      <circle cx="26" cy="29" r="7" fill="#66707d"/>
      <text x="48" y="36" fill="#f4f7fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">ascend-lab</text>
      <text x="278" y="36" fill="#8995a4" font-size="18" font-weight="700">STOPPED</text>
      <path d="M392 29H416" stroke="#4f78a6" stroke-width="2"/>
    </g>

    <g transform="translate(716 280)">
      <rect width="434" height="58" rx="12" fill="#0b1018" stroke="#26384d"/>
      <circle cx="26" cy="29" r="7" fill="#9ab7d4"/>
      <text x="48" y="36" fill="#f4f7fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">training</text>
      <text x="278" y="36" fill="#9ab7d4" font-size="18" font-weight="700">RUNNING</text>
      <path d="M392 29H416" stroke="#7fa8d1" stroke-width="2"/>
    </g>

    <text x="64" y="396" fill="#778393" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">LIFECYCLE API</text>
    <text x="230" y="396" fill="#778393" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">EXPLICIT TARGETS</text>
    <text x="436" y="396" fill="#778393" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">WAIT EVERY TARGET</text>
    <text x="1030" y="396" fill="#7fa8d1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">mc / 0.6.0</text>
  </g>
</svg>
